# VPS deployment — pulls the pre-built image from Docker Hub instead of
# building on-box (a 2GB-RAM VPS shouldn't compile rocksdb from source).
#
#   docker buildx build --platform linux/amd64 -t d4rkriverr/arxd:latest --push .
#   # on the VPS:
#   cp .env.example .env && edit .env (ARXD_DOMAIN, ARXD_RPC_TOKEN)
#   docker compose -f docker-compose.prod.yml up -d
#
# Nginx is the only internet-facing service — it terminates TLS (automatic
# Let's Encrypt renewal) and reverse-proxies to arxd over the private
# compose network. arxd itself is never published to the host, so RPC
# traffic (including the bearer token on every request) never crosses the
# internet in plaintext. NodeIndexer is the only consumer that talks to
# arxd directly, over P2P (30334), which stays published since P2P has no
# TLS-terminating proxy in front of it.
services:
  arxd:
    image: d4rkriverr/arxd:latest
    ports:
      - "30334:30334/tcp" # P2P
      - "30334:30334/udp" # P2P (QUIC)
    volumes:
      - arxd-data:/data
    command: ["--base-path", "/data", "--bootnode", "--validator", "--rpc-bind", "0.0.0.0", "--rpc-token", "${ARXD_RPC_TOKEN:?set ARXD_RPC_TOKEN in .env}"]
    restart: unless-stopped

  nginx:
    image: nginxproxy/nginx-proxy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
    restart: unless-stopped

  acme:
    image: nginxproxy/acme-companion:2.5.1
    depends_on:
      - nginx
    environment:
      DEFAULT_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      NGINX_PROXY_CONTAINER: ${COMPOSE_PROJECT_NAME:-arxium}-nginx-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs:rw
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme-data:/etc/acme.sh
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - arxd
    environment:
      VIRTUAL_HOST: "${ARXD_DOMAIN:?set ARXD_DOMAIN in .env}"
      LETSENCRYPT_HOST: "${ARXD_DOMAIN:?set ARXD_DOMAIN in .env}"
      LETSENCRYPT_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  arxd-data:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme-data:
