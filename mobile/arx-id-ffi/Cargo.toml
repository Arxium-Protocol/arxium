[package]
name = "arx-id-ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
circuit-identity-zk = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-serialize = { workspace = true }
ark-ff = { workspace = true }
# `getrandom` turns on OsRng in the rand 0.8 arkworks already pulls in; the
# rest of the workspace is on 0.9, which arkworks' traits do not accept.
ark-std = { workspace = true, features = ["getrandom"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
