[package]
name = "arxd-node"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
qrcode = { version = "0.14", default-features = false }

xc-primitives = { workspace = true }
xc-bls = { workspace = true }
xc-storage = { workspace = true }
xc-circuit = { workspace = true }
xc-executor = { workspace = true }
xc-mempool = { workspace = true }
xc-cli = { workspace = true }
xc-chain-spec = { workspace = true }
genesis = { workspace = true }
xc-rpc = { workspace = true }
network = { workspace = true }
xc-evidence = { workspace = true }
finality = { workspace = true }
xc-runtime-api = { workspace = true }

[dev-dependencies]
# arxd-node is generic over ChainRuntime and must never depend on
# CoreChain's concrete arxd-runtime in production code (that coupling is
# what let a toy-chain node inherit a `pair` subcommand it couldn't
# decode) — tests still exercise the concrete CoreChainRuntime.
arxd-runtime = { workspace = true }
