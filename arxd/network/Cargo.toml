[package]
name = "arxd-network"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
serde = { workspace = true }
bincode = { workspace = true, features = ["serde"] }
metrics = { workspace = true }
xc-primitives = { workspace = true }
xc-wire = { workspace = true }
xc-mempool = { workspace = true }
xc-storage = { workspace = true }
arxd-finality = { workspace = true }
libp2p = { version = "0.56.0", features = ["tcp", "quic", "noise", "yamux", "tokio", "mdns", "macros", "gossipsub", "request-response", "cbor"] }
