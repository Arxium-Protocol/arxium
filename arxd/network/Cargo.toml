[package]
name = "arxd-network"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
serde = { workspace = true }
bincode = { workspace = true, features = ["serde"] }
metrics = { workspace = true }
xc-primitives = { workspace = true }
xc-mempool = { workspace = true }
xc-storage = { workspace = true }
arxd-finality = { workspace = true }
xc-circuit = { workspace = true }
xc-bls = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libp2p = { version = "0.57.0", features = ["tcp", "quic", "noise", "yamux", "tokio", "mdns", "macros", "gossipsub", "request-response", "cbor", "identify"] }

[features]
# Harness-only knobs (`ARXD_BLOCK_PEERS`, see `build_swarm`; the
# withholding proposer, see `withhold`). Pulls in nothing but finality's own
# gate, which owns the withheld height.
fault-injection = ["arxd-finality/fault-injection"]

[lints]
workspace = true

