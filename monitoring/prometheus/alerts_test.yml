# Unit tests for alerts.yml, run by `promtool test rules`.
#
# These pin firing behaviour, not just YAML validity: `promtool check config`
# accepts a rule whose expression never matches anything. Each case drives
# synthetic series through a rule and asserts what fires and what stays
# silent.
#
# Rules using increase() are deliberately absent: its extrapolation yields
# values like 10.000000000000002, so asserting a templated "{{ $value }}"
# summary against them is brittle rather than useful.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # --- retracer -----------------------------------------------------------

  # The case this suite exists for: retracerd keeps answering scrapes
  # (up == 1) while its database is unreachable. RetracerDown must stay
  # silent, because /metrics still returns 200 in that state, and only
  # RetracerDatabaseDown covers it.
  - interval: 1m
    input_series:
      - series: 'up{job="retracer"}'
        values: '1x10'
      - series: 'retracer_database_up'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RetracerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: RetracerDatabaseDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Retracer cannot reach its database"
              description: "retracerd is answering scrapes but its database check has been failing for two minutes. Check Postgres and retracerd's logs.\n"

  # A healthy database must not fire it, and the 2m `for:` must hold.
  - interval: 1m
    input_series:
      - series: 'retracer_database_up'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RetracerDatabaseDown
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'retracer_database_up'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: RetracerDatabaseDown
        exp_alerts: []

  # The process being down is still RetracerDown's job.
  - interval: 1m
    input_series:
      - series: 'up{job="retracer"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RetracerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: retracer
            exp_annotations:
              summary: "Retracer metrics are unavailable"
              description: "Prometheus has been unable to scrape retracerd for two minutes. Check systemctl status retracerd and curl http://127.0.0.1:8080/health.\n"

  # Lag fires per chain, and a stalled tip is caught even while lag reads 0.
  - interval: 1m
    input_series:
      - series: 'retracer_blocks_behind{chain_id="corechain-devnet"}'
        values: '45x10'
      - series: 'retracer_tip_age_seconds{chain_id="corechain-devnet"}'
        values: '5x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: RetracerLagging
        exp_alerts:
          - exp_labels:
              severity: warning
              chain_id: corechain-devnet
            exp_annotations:
              summary: "Retracer chain corechain-devnet is 45 blocks behind"
              description: "The indexed height has trailed the network tip by more than 30 blocks for five minutes.\n"
      - eval_time: 6m
        alertname: RetracerChainStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'retracer_blocks_behind{chain_id="corechain-devnet"}'
        values: '0x10'
      - series: 'retracer_tip_age_seconds{chain_id="corechain-devnet"}'
        values: '300x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: RetracerLagging
        exp_alerts: []
      - eval_time: 6m
        alertname: RetracerChainStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              chain_id: corechain-devnet
            exp_annotations:
              summary: "Retracer chain corechain-devnet tip is stale (5m 0s old)"
              description: "The indexed tip's own on-chain timestamp has been more than 120 seconds behind wall-clock time for five minutes, even though retracer_blocks_behind may still read zero.\n"

  # --- arxium-node --------------------------------------------------------

  - interval: 1m
    input_series:
      - series: 'up{job="arxium-node"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArxiumMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: arxium-node
            exp_annotations:
              summary: "Arxium node metrics are unavailable"
              description: "Prometheus has been unable to scrape arxd for one minute. Check systemctl status arxd and curl http://127.0.0.1:30333/metrics.\n"

  # Quorum is unreachable when the keyed validators' power is below it.
  - interval: 1m
    input_series:
      - series: 'arxium_voting_power_with_bls_key'
        values: '3334x5'
      - series: 'arxium_finality_quorum'
        values: '6667x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArxiumFinalityUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Finality quorum is unreachable"
              description: "Validators holding BLS keys carry 3334 voting power, below the finality quorum. Register the missing validator keys.\n"

  # Enough keyed power for quorum must not fire.
  - interval: 1m
    input_series:
      - series: 'arxium_voting_power_with_bls_key'
        values: '6667x5'
      - series: 'arxium_finality_quorum'
        values: '6667x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArxiumFinalityUnreachable
        exp_alerts: []

  # Regression: the live devnet has 2 keyed validators holding all 10000
  # power. Comparing the head count (2) to the quorum power (6667) made this
  # rule fire forever; the power comparison must stay quiet.
  - interval: 1m
    input_series:
      - series: 'arxium_validators_with_bls_key'
        values: '2x5'
      - series: 'arxium_voting_power_with_bls_key'
        values: '10000x5'
      - series: 'arxium_finality_quorum'
        values: '6667x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ArxiumFinalityUnreachable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'arxium_mempool_pending_actions'
        values: '1500x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ArxiumMempoolBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "1500 actions have been pending for at least 5 minutes"

  # Retracer DB growing 72 MB/h from 1 GB: projected ~13.6 GB in a week,
  # over the 12 GB budget (and under the old 20 GB placeholder, which is
  # exactly the case the placeholder missed).
  - interval: 10m
    input_series:
      - series: 'retracer_database_size_bytes'
        values: '1e9+12e6x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: RetracerDiskGrowth
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Retracer's database is projected to exceed its disk budget within a week"
              description: "Linear projection of retracer_database_size_bytes over the last 6 hours crosses the 12 GB budget within the next 7 days. The database shares the root disk with the node's chain data.\n"

  # Slow growth (30 MB/h) projects to ~6 GB: must stay quiet.
  - interval: 10m
    input_series:
      - series: 'retracer_database_size_bytes'
        values: '1e9+5e6x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: RetracerDiskGrowth
        exp_alerts: []

  # A flat database (today's ~110 MiB) must stay quiet.
  - interval: 10m
    input_series:
      - series: 'retracer_database_size_bytes'
        values: '110e6x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: RetracerDiskGrowth
        exp_alerts: []

  # --- host ---------------------------------------------------------------

  # The 2026-09-21 shape: 40 GB root disk losing ~1.8 GB/h. Projected empty
  # well inside 3 days, while still above 10% free, so only the early
  # warning fires.
  - interval: 10m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="host",device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '20e9-300e6x50'
      - series: 'node_filesystem_size_bytes{job="host",device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '40e9x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: HostDiskWillFillIn3Days
        exp_alerts:
          - exp_labels:
              severity: warning
              job: host
              device: /dev/sda2
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Disk / is projected to fill within 3 days"
              description: "At the rate of the last 6 hours, free space on / (/dev/sda2) reaches zero within 3 days. Find what grows with du before the node stops.\n"
      - eval_time: 7h
        alertname: HostDiskAlmostFull
        exp_alerts: []

  # Slow growth (30 MB/h, ~2 GB in 3 days against 20 GB free): quiet.
  - interval: 10m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="host",device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '20e9-5e6x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: HostDiskWillFillIn3Days
        exp_alerts: []

  # tmpfs mounts fill and drain by design; they must never page.
  - interval: 10m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="host",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '1e9-100e6x50'
      - series: 'node_filesystem_size_bytes{job="host",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '1e9x50'
    alert_rule_test:
      - eval_time: 7h
        alertname: HostDiskWillFillIn3Days
        exp_alerts: []
      - eval_time: 7h
        alertname: HostDiskAlmostFull
        exp_alerts: []

  # Flat at 7.5% free: already critical even with no growth.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="host",device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '3e9x20'
      - series: 'node_filesystem_size_bytes{job="host",device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '40e9x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: HostDiskAlmostFull
        exp_alerts: []
      - eval_time: 10m
        alertname: HostDiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              job: host
              device: /dev/sda2
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Disk / has 7.5% free"
              description: "Less than 10% of / (/dev/sda2) is free. RocksDB and Postgres stop writing when it reaches zero.\n"
      - eval_time: 10m
        alertname: HostDiskWillFillIn3Days
        exp_alerts: []

  # A dead exporter must be visible, otherwise the disk rules go silent.
  - interval: 1m
    input_series:
      - series: 'up{job="host",instance="127.0.0.1:9100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: HostMetricsUnavailable
        exp_alerts: []
      - eval_time: 6m
        alertname: HostMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: host
              instance: 127.0.0.1:9100
            exp_annotations:
              summary: "Host metrics are unavailable"
              description: "Prometheus has been unable to scrape node_exporter for five minutes, so the disk alerts below cannot fire. Check systemctl status arxium-node-exporter.\n"
