# Single-node rules using metrics exported by arxd.
groups:
  - name: arxium-node
    rules:
      - alert: ArxiumMetricsUnavailable
        expr: up{job="arxium-node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Arxium node metrics are unavailable"
          description: >
            Prometheus has been unable to scrape arxd for one minute. Check
            systemctl status arxd and curl http://127.0.0.1:30333/metrics.

      # Alert on the tip timestamp, not height or process state. A stalled
      # arxd process can remain active while the height no longer advances.
      - alert: ArxiumChainStalled
        expr: time() - arxium_tip_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node tip is stale ({{ $value | humanizeDuration }} old)"
          description: >
            The tip block timestamp has been more than 120 seconds behind
            wall-clock time for one minute. Process supervision alone does
            not detect this application-liveness failure.

      - alert: ArxiumFinalityUnreachable
        expr: arxium_voting_power_with_bls_key < arxium_finality_quorum
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Finality quorum is unreachable"
          description: >
            Validators holding BLS keys carry {{ $value }} voting power, below
            the finality quorum. Register the missing validator keys.

      - alert: ArxiumBlocksRejected
        expr: increase(arxium_blocks_rejected_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} block(s) rejected in the last 10 minutes"

      - alert: ArxiumProductionErrors
        expr: increase(arxium_block_production_errors_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} block production error(s) in the last 10 minutes"

      - alert: ArxiumMempoolBacklog
        expr: arxium_mempool_pending_actions > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} actions have been pending for at least 5 minutes"

      # Honest traffic is a few items per block against a 1024-slot queue, so
      # any drop means the swarm loop stalled (usually a slow on_block).
      - alert: ArxiumOutboundDropped
        expr: increase(arxium_network_outbound_dropped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} outbound {{ $labels.channel }} message(s) dropped in the last 10 minutes"

      # A height that never got a certificate while later ones did (D-25).
      # Certificates can land out of order for a few seconds; a gap that
      # lasts minutes is permanent and nothing past it ever settles.
      - alert: ArxiumFinalityGap
        expr: arxium_finalized_height - arxium_final_watermark > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "final_watermark is {{ $value }} height(s) behind finalized_height"
          description: >
            A height below finalized_height has no finality certificate, so
            final_watermark and settled_height have stopped. See Trello D-25
            and docs/consensus-round-change.md.

      # An upheld execution dispute governance has not resolved: settlement
      # is paused below it until a ResolveDispute passes. Page immediately;
      # procedure in docs/consensus-safety.md §5.
      - alert: ArxiumDisputeOpen
        expr: arxium_open_dispute_height > 0
        labels:
          severity: critical
        annotations:
          summary: "Execution dispute upheld at height {{ $value }}, unresolved"
          description: >
            An execution dispute was upheld and settlement is paused below it.
            Governance must pass ResolveDispute (Accept or Forked). The node
            logged "execution dispute upheld"; /status shows open_dispute_height.

      # `floor` (catch-up) and `round_left` (D-25 round change) refusals are
      # routine and not alerted on.
      - alert: ArxiumVoteConflictRefused
        expr: increase(arxium_finality_votes_refused_total{reason="conflict"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "signed_votes refused a conflicting vote"
          description: >
            The validator was about to sign a vote that conflicts with one it
            already signed. The signed_votes file prevented a slash, which
            means a restore or rollback happened. Find out why.

      - alert: ArxiumVoteRecordWriteFailed
        expr: increase(arxium_finality_votes_refused_total{reason="write_failed"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Votes skipped: signed_votes could not be written"
          description: >
            The validator is not voting because it cannot persist its
            signed-vote record. Check the disk space and permissions of the
            base path.

  # Only fires on a host that also scrapes the `retracer` job in
  # prometheus.yml, i.e. one also running retracerd. Harmless if that job
  # isn't configured: these rules simply never match any series.
  - name: retracer
    rules:
      - alert: RetracerDown
        expr: up{job="retracer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Retracer metrics are unavailable"
          description: >
            Prometheus has been unable to scrape retracerd for two minutes.
            Check systemctl status retracerd and curl
            http://127.0.0.1:8080/health.

      # up==1 alone misses this: /metrics still returns 200 with
      # retracer_database_up 0 when only the database is unreachable, so
      # RetracerDown above never fires for a database-only outage.
      - alert: RetracerDatabaseDown
        expr: retracer_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Retracer cannot reach its database"
          description: >
            retracerd is answering scrapes but its database check has been
            failing for two minutes. Check Postgres and retracerd's logs.

      - alert: RetracerLagging
        expr: retracer_blocks_behind > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Retracer chain {{ $labels.chain_id }} is {{ $value }} blocks behind"
          description: >
            The indexed height has trailed the network tip by more than 30
            blocks for five minutes.

      # Alert on the tip timestamp, not the lag figure — mirrors
      # ArxiumChainStalled above. A halted node can leave retracer_blocks_behind
      # at zero while nothing new is being indexed.
      - alert: RetracerChainStalled
        expr: retracer_tip_age_seconds > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Retracer chain {{ $labels.chain_id }} tip is stale ({{ $value | humanizeDuration }} old)"
          description: >
            The indexed tip's own on-chain timestamp has been more than 120
            seconds behind wall-clock time for five minutes, even though
            retracer_blocks_behind may still read zero.

      # Budget: 12 GB. Retracer's Postgres shares VPS A's 40 GB root disk
      # with the node's chain data, so the old 20 GB placeholder equalled
      # all the free space: by the time it fired, the disk was already gone.
      # 12 GB leaves room to react.
      - alert: RetracerDiskGrowth
        expr: predict_linear(retracer_database_size_bytes[6h], 7 * 24 * 3600) > 12e9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Retracer's database is projected to exceed its disk budget within a week"
          description: >
            Linear projection of retracer_database_size_bytes over the last
            6 hours crosses the 12 GB budget within the next 7 days. The
            database shares the root disk with the node's chain data.

  # Host disk. Needs the `host` job (node_exporter on 127.0.0.1:9100), which
  # the native installer always adds; elsewhere these rules match nothing.
  # A full root disk halted the chain on 2026-09-21, and nothing watched it:
  # the chain data, Retracer's Postgres and the logs all share that disk.
  - name: host
    rules:
      - alert: HostMetricsUnavailable
        expr: up{job="host"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host metrics are unavailable"
          description: >
            Prometheus has been unable to scrape node_exporter for five
            minutes, so the disk alerts below cannot fire. Check systemctl
            status arxium-node-exporter.

      # Linear projection over 6 hours, like RetracerDiskGrowth, so a short
      # burst (a compaction, a backup dump) does not page.
      - alert: HostDiskWillFillIn3Days
        expr: >
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}[6h], 3 * 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is projected to fill within 3 days"
          description: >
            At the rate of the last 6 hours, free space on
            {{ $labels.mountpoint }} ({{ $labels.device }}) reaches zero
            within 3 days. Find what grows with du before the node stops.

      - alert: HostDiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
          description: >
            Less than 10% of {{ $labels.mountpoint }} ({{ $labels.device }})
            is free. RocksDB and Postgres stop writing when it reaches zero.
