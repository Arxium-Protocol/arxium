global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: arxium-node
    static_configs:
      - targets: ['127.0.0.1:30333']

  # Commented out by default: this file is shared by every node deployment,
  # and most don't run retracerd (Retracer, a separate indexer — see its own
  # repo). Uncomment only on a host that also runs it — leaving it active on
  # an arxd-only host makes the target permanently unreachable, which is a
  # real "down" for Prometheus and fires RetracerDown (alerts.yml) forever.
  #
  # retracerd binds /metrics to loopback by default (--rest-bind,
  # RETRACER_REST_BIND), matching arxd's own bind-to-loopback posture above.
  #
  # Unlike /health and /ready, /metrics is NOT exempt from retracerd's
  # bearer auth, so wherever RETRACER_AUTH_TOKEN is set the scrape must send
  # it or every request returns 401 — which reads as a down target and fires
  # RetracerDown forever. credentials_file wants a file holding just the
  # token (Prometheus config format, not a KEY=VALUE .env line), readable by
  # the unprivileged prometheus account. Arxium-Ops provisions exactly that
  # on a managed host; drop the authorization block if the retracerd you are
  # scraping runs without a token.
  # - job_name: retracer
  #   # Each scrape re-runs Retracer's database/table-size queries; don't
  #   # inherit this file's 5s global interval meant for arxd's own metrics.
  #   scrape_interval: 30s
  #   authorization:
  #     credentials_file: /etc/arxium-monitoring/retracer-scrape-token
  #   static_configs:
  #     - targets: ['127.0.0.1:8080']
