name: SDK

on:
  pull_request:
    paths:
      - "sdk/ts/**"
      - "arxd/runtime/src/payload.rs"
      - "arxd/runtime/src/lib.rs"
  push:
    branches: [main]
    paths:
      - "sdk/ts/**"
      - "arxd/runtime/src/payload.rs"
      - "arxd/runtime/src/lib.rs"
    tags: ["sdk-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d38b0b90a2d53d1cf092c1f5f2b # v4.0.4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
        working-directory: sdk/ts
      - run: cargo test -p arxd-runtime writes_typescript_signed_action_fixtures
      - run: git diff --exit-code -- sdk/ts/fixtures/signed-actions.json
      - run: npm test
        working-directory: sdk/ts

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d38b0b90a2d53d1cf092c1f5f2b # v4.0.4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@arxium-protocol"
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
        working-directory: sdk/ts
      - run: npm publish
        working-directory: sdk/ts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
