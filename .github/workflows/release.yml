name: Release arxd

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential libclang-dev pkg-config

      - name: Build arxd (release)
        shell: bash
        run: cargo build --release --locked -p arxd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="arxd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/arxd "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"

      # scripts/install.sh refuses to unpack anything whose digest isn't in
      # this file, so it has to ship with every release. Generated from inside
      # dist/ so the file holds bare names, not `dist/`-prefixed paths, and
      # `sha256sum -c` works from whatever directory the installer downloaded
      # into.
      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
