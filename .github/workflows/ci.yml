name: Version CI and Release

# An exact semantic version tag is the deployment trigger for the devnet
# nodes on VPS A and VPS B. The tag must sit on the current remote main tip:
# a side-branch tag, a stale tag, or a malformed tag fails in validate-tag
# before anything is built, released, or dispatched. After the release is
# published this workflow dispatches arxium-version-release-v1 to the private
# Arxium-Ops repository, which owns every host-side action. Nothing here
# touches a VPS, and nothing here resets chain state.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: arxium-version-release
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Arxium-Protocol/arxium

jobs:
  validate-tag:
    name: Validate the deployment tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      storage_schema_version: ${{ steps.tag.outputs.storage_schema_version }}

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require an exact version tag at the current main tip
        id: tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || {
            printf 'error: this workflow runs only for tags\n' >&2
            exit 1
          }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'error: %s is not an exact vX.Y.Z version tag\n' "$version" >&2
            exit 1
          }

          # The tag must name the current remote main tip. A tag on a side
          # branch, or one left behind by later merges, would otherwise deploy
          # code that main no longer contains.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          tagged="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [[ "$tagged" == "$main_tip" ]] || {
            printf 'error: tag %s points at %s but main is at %s\n' \
              "$version" "$tagged" "$main_tip" >&2
            printf 'A deployment tag must be created at the current main tip.\n' >&2
            exit 1
          }

          prior="$(git tag --merged "${tagged}^" --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -n "$prior" ]]; then
            IFS=. read -r major minor patch <<< "${version#v}"
            IFS=. read -r prior_major prior_minor prior_patch <<< "${prior#v}"
            ((10#$major > 10#$prior_major ||
              (10#$major == 10#$prior_major && 10#$minor > 10#$prior_minor) ||
              (10#$major == 10#$prior_major && 10#$minor == 10#$prior_minor &&
               10#$patch > 10#$prior_patch))) || {
              printf 'error: tag %s must be numerically greater than prior release %s\n' \
                "$version" "$prior" >&2
              exit 1
            }
          fi

          # The node refuses to open a database stamped with a different
          # schema, so Arxium-Ops compares this against the schema recorded
          # for the installed release and stops with reset-required rather
          # than stopping both nodes on a binary that cannot start.
          schema="$(grep -oE 'pub const SCHEMA_VERSION: u32 = [0-9]+' \
            core/storage/src/lib.rs | grep -oE '[0-9]+$')"
          [[ "$schema" =~ ^[0-9]+$ ]] || {
            printf 'error: could not read SCHEMA_VERSION from core/storage/src/lib.rs\n' >&2
            exit 1
          }

          {
            printf 'version=%s\n' "$version"
            printf 'source_sha=%s\n' "$tagged"
            printf 'storage_schema_version=%s\n' "$schema"
          } >> "$GITHUB_OUTPUT"

          {
            printf '## Deployment tag accepted\n\n'
            printf 'Version: %s\n\n' "$version"
            printf 'Commit: %s (current main tip)\n\n' "$tagged"
            printf 'Storage schema version: %s\n' "$schema"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test the workspace
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: arxd-node must not depend on CoreChain in production
        shell: bash
        run: |
          # arxd-node is generic over ChainRuntime; a production dependency on
          # arxd-runtime (CoreChain's concrete runtime) is exactly the coupling
          # that once let a toy-chain node inherit a `pair` subcommand it
          # couldn't decode. arxd-runtime is only a dev-dependency (tests).
          ! cargo tree -p arxd-node -e normal -i arxd-runtime 2>/dev/null | grep -q arxd-runtime

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

  monitoring:
    name: Validate monitoring bundle
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Arxium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh monitoring/native/*.sh

      - name: Check Prometheus configuration and rules
        shell: bash
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml

      # `check config` only proves the rules parse. This asserts what they
      # actually fire on, which is how a rule that never matches anything
      # gets caught.
      - name: Unit-test the alert rules
        shell: bash
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            test rules /etc/prometheus/alerts_test.yml

      - name: Check Compose and dashboard files
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config --quiet
          jq empty monitoring/grafana/dashboards/arxium-node.json

      - name: Smoke-test Prometheus and Grafana
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose -p arxium-monitoring-ci \
              -f monitoring/docker-compose.monitoring.yml down --volumes
          }
          trap cleanup EXIT

          docker compose -p arxium-monitoring-ci \
            -f monitoring/docker-compose.monitoring.yml up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
              && curl -fsS \
                --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
                'http://127.0.0.1:3000/api/search?query=Arxium%20Node' \
                | jq -e 'any(.[]; .title == "Arxium Node")' >/dev/null \
              && curl -fsS \
                --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
                http://127.0.0.1:3000/api/datasources/uid/prometheus \
                | jq -e '.url == "http://127.0.0.1:9090"' >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              docker compose -p arxium-monitoring-ci \
                -f monitoring/docker-compose.monitoring.yml logs
              exit 1
            fi
            sleep 2
          done

          curl -fsS \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            'http://127.0.0.1:3000/api/search?query=Arxium%20Node' \
            | jq -e 'any(.[]; .title == "Arxium Node")'
          curl -fsS \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            http://127.0.0.1:3000/api/datasources/uid/prometheus \
            | jq -e '.url == "http://127.0.0.1:9090"'

      - name: Smoke-test native monitoring installer
        shell: bash
        env:
          GRAFANA_PUBLIC_HOST: 127.0.0.1
          GRAFANA_ADMIN_USER: ci-admin
          GRAFANA_TEST_PASSWORD: CiNativeValidation1!
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          cleanup() {
            sudo ./monitoring/native/uninstall-monitoring.sh || true
          }
          trap cleanup EXIT

          # root (via sudo below) writes to this file through `script`, so it
          # has to be root-owned from creation: /tmp is sticky+world-writable,
          # and the kernel's fs.protected_regular hardening (on by default on
          # Ubuntu 24.04) refuses to open a regular file there for writing
          # when its owner is neither the directory owner nor the opener —
          # even for root — so a runner-owned file from a plain `mktemp`
          # fails with "Permission denied" the moment `script` tries to open it.
          retry_log="$(sudo mktemp)"
          sudo chmod 644 "$retry_log"
          { sleep 1; printf 'short\nshort\n%s\nDifferentPassword1!\n%s\n%s\n' \
            "$GRAFANA_TEST_PASSWORD" "$GRAFANA_TEST_PASSWORD" "$GRAFANA_TEST_PASSWORD"; } \
            | sudo --preserve-env=GRAFANA_PUBLIC_HOST,GRAFANA_ADMIN_USER \
              script --quiet --return \
                --command 'stty -echo; ./monitoring/native/install-monitoring.sh' "$retry_log"
          grep -Fq 'Grafana password must be at least 12 characters (2 attempt(s) remaining)' "$retry_log"
          grep -Fq 'Grafana passwords do not match (1 attempt(s) remaining)' "$retry_log"
          sudo rm -f "$retry_log"

          test -f /etc/arxium-monitoring/grafana-initialized
          test ! -e /etc/arxium-monitoring/grafana-bootstrap.env
          sudo systemctl is-active --quiet arxium-prometheus arxium-grafana
          # Host disk alerts depend on this exporter and on Prometheus scraping it.
          sudo systemctl is-active --quiet arxium-node-exporter
          node_metrics="$(curl -fsS http://127.0.0.1:9100/metrics)"
          grep -q '^node_filesystem_avail_bytes{' <<< "$node_metrics"
          if curl --max-time 2 -fsS "http://$(hostname -I | awk '{print $1}'):9100/metrics" >/dev/null; then
            echo "node_exporter is reachable beyond loopback" >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22host%22%7D' \
              | jq -e '.data.result[0].value[1] == "1"' >/dev/null && break
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22host%22%7D' \
            | jq -e '.data.result[0].value[1] == "1"' >/dev/null
          curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
            -fsS https://127.0.0.1:3000/api/health >/dev/null
          curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
            --user "${GRAFANA_ADMIN_USER}:${GRAFANA_TEST_PASSWORD}" \
            -fsS 'https://127.0.0.1:3000/api/search?query=Arxium%20Node' \
            | jq -e 'any(.[]; .title == "Arxium Node")'

          grafana_pid="$(systemctl show -p MainPID --value arxium-grafana)"
          ! sudo sh -c "tr '\\0' '\\n' < /proc/${grafana_pid}/environ" \
            | grep -q '^GF_SECURITY_ADMIN_PASSWORD='
          sudo nft list table inet arxium_grafana >/dev/null
          sudo -u grafana curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          python3 -m http.server 30333 --bind 127.0.0.1 >/dev/null 2>&1 &
          rpc_server_pid=$!
          sleep 1
          if sudo -u grafana curl --max-time 2 -fsS http://127.0.0.1:30333/ >/dev/null; then
            echo "Grafana service account unexpectedly reached the node RPC port" >&2
            kill "$rpc_server_pid"
            exit 1
          fi
          kill "$rpc_server_pid"

          sudo ./monitoring/native/install-monitoring.sh
          if sudo ALERTMANAGER=1 ALERTMANAGER_CONFIG=/missing-alertmanager.yml \
            ./monitoring/native/install-monitoring.sh; then
            echo "Expected the invalid Alertmanager upgrade to fail" >&2
            exit 1
          fi
          sudo systemctl is-active --quiet arxium-prometheus arxium-grafana
          for attempt in $(seq 1 60); do
            if curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
              --user "${GRAFANA_ADMIN_USER}:${GRAFANA_TEST_PASSWORD}" \
              -fsS https://127.0.0.1:3000/api/user >/dev/null; then
              break
            fi
            [[ "$attempt" -lt 60 ]] || exit 1
            sleep 1
          done

          sudo systemctl stop arxium-grafana
          sudo mv /var/lib/arxium-monitoring/grafana/data/grafana.db /tmp/grafana.db
          if sudo ./monitoring/native/install-monitoring.sh; then
            echo "Expected the missing Grafana database check to fail closed" >&2
            exit 1
          fi
          ! sudo systemctl is-active --quiet arxium-grafana
          sudo mv /tmp/grafana.db /var/lib/arxium-monitoring/grafana/data/grafana.db
          sudo chown grafana:grafana /var/lib/arxium-monitoring/grafana/data/grafana.db
          sudo ./monitoring/native/install-monitoring.sh

  release:
    name: Build and publish release
    needs:
      - validate-tag
      - test
      - monitoring
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.checksums.outputs.archive_sha256 }}
      binary_sha256: ${{ steps.checksums.outputs.binary_sha256 }}
      monitoring_archive_sha256: ${{ steps.checksums.outputs.monitoring_archive_sha256 }}

    steps:
      - name: Check out Arxium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential libclang-dev pkg-config

      - name: Build arxd (release)
        shell: bash
        run: cargo build --release --locked -p arxd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="arxd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/arxd "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"
          # alerts_test.yml is CI-only fixture data for `promtool test rules`;
          # Prometheus never loads it (prometheus.yml's rule_files lists just
          # alerts.yml), so keep it out of what gets installed on a node.
          tar -czf "dist/arxium-monitoring-${tag}.tar.gz" \
            --exclude='monitoring/prometheus/alerts_test.yml' \
            monitoring

      # scripts/install.sh verifies the node and monitoring archives against this file.
      # The same three checksums are exported so Arxium-Ops can pin the exact
      # archive and the exact executable it installs on both nodes, instead of
      # trusting whatever a release URL happens to serve later.
      - name: Generate checksums
        id: checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          binary_sha256="$(sha256sum target/release/arxd | awk '{print $1}')"
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  arxd-${GITHUB_REF_NAME}-x86_64-linux-gnu[.]tar[.]gz$" SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  arxium-monitoring-${GITHUB_REF_NAME}[.]tar[.]gz$" SHA256SUMS
          cat SHA256SUMS
          archive_sha256="$(awk -v f="arxd-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" \
            '$2 == f {print $1}' SHA256SUMS)"
          monitoring_sha256="$(awk -v f="arxium-monitoring-${GITHUB_REF_NAME}.tar.gz" \
            '$2 == f {print $1}' SHA256SUMS)"
          for value in "$binary_sha256" "$archive_sha256" "$monitoring_sha256"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || {
              printf 'error: a release checksum is missing or malformed\n' >&2
              exit 1
            }
          done
          {
            printf 'archive_sha256=%s\n' "$archive_sha256"
            printf 'binary_sha256=%s\n' "$binary_sha256"
            printf 'monitoring_archive_sha256=%s\n' "$monitoring_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  dispatch-deployment:
    name: Dispatch the release to Arxium-Ops
    needs:
      - validate-tag
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Arxium-Ops owns every host-side action. This job only states, in one
      # checksum-pinned document, what was released. It has no VPS access and
      # no ability to reset chain state.
      - name: Dispatch arxium-version-release-v1
        shell: bash
        env:
          ARXIUM_OPS_DISPATCH_TOKEN: ${{ secrets.ARXIUM_OPS_DISPATCH_TOKEN }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          STORAGE_SCHEMA_VERSION: ${{ needs.validate-tag.outputs.storage_schema_version }}
          ARCHIVE_SHA256: ${{ needs.release.outputs.archive_sha256 }}
          BINARY_SHA256: ${{ needs.release.outputs.binary_sha256 }}
          MONITORING_ARCHIVE_SHA256: ${{ needs.release.outputs.monitoring_archive_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ -n "$ARXIUM_OPS_DISPATCH_TOKEN" ]] || {
            printf 'error: ARXIUM_OPS_DISPATCH_TOKEN is not configured; ' >&2
            printf 'create the dispatch-only credential before tagging\n' >&2
            exit 1
          }
          # Quoted heredoc: no shell reader ever sees a $ inside single quotes,
          # and nothing materializes from data.
          python3 - "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID" \
            "$ARCHIVE_SHA256" "$BINARY_SHA256" "$MONITORING_ARCHIVE_SHA256" \
            "$STORAGE_SCHEMA_VERSION" "$SOURCE_REPOSITORY" \
            <<'PYEOF' > dispatch.json
          import json, re, sys

          args = sys.argv[1:]
          if len(args) != 8:
              raise SystemExit("want 8 arguments, got %d" % len(args))
          (version, source_sha, run_id, archive_sha256, binary_sha256,
           monitoring_sha256, schema_version, source_repository) = args
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("version is not an exact vX.Y.Z tag")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_sha is not a 40-character hex commit")
          for name, value in (("archive_sha256", archive_sha256),
                              ("binary_sha256", binary_sha256),
                              ("monitoring_archive_sha256", monitoring_sha256)):
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(name + " is not a 64-character hex digest")
          print(json.dumps({
              "event_type": "arxium-version-release-v1",
              "client_payload": {
                  "version": version,
                  "source_repository": source_repository,
                  "source_sha": source_sha,
                  "source_run_id": int(run_id),
                  "archive_sha256": archive_sha256,
                  "binary_sha256": binary_sha256,
                  "monitoring_archive_sha256": monitoring_sha256,
                  "storage_schema_version": int(schema_version),
              },
          }))
          PYEOF

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $ARXIUM_OPS_DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/Arxium-Protocol/Arxium-Ops/dispatches \
            --data @dispatch.json

          {
            printf '## Deployment dispatched\n\n'
            printf 'Version: %s\n\n' "$VERSION"
            printf 'Commit: %s\n\n' "$SOURCE_SHA"
            printf 'Archive sha256: %s\n\n' "$ARCHIVE_SHA256"
            printf 'Binary sha256: %s\n\n' "$BINARY_SHA256"
            printf 'Storage schema version: %s\n\n' "$STORAGE_SCHEMA_VERSION"
            printf 'Arxium-Ops decides whether this release is state-compatible. '
            printf 'A schema or genesis change stops there as reset-required.\n'
          } >> "$GITHUB_STEP_SUMMARY"
