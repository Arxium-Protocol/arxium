name: Version CI and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Test the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

  monitoring:
    name: Validate monitoring bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh monitoring/native/*.sh

      - name: Check Prometheus configuration and rules
        shell: bash
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Check Compose and dashboard files
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config --quiet
          jq empty monitoring/grafana/dashboards/arxium-node.json

  release:
    name: Build and publish release
    needs:
      - test
      - monitoring
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential libclang-dev pkg-config

      - name: Build arxd (release)
        shell: bash
        run: cargo build --release --locked -p arxd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="arxd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/arxd "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"

      # scripts/install.sh verifies every release archive against this file.
      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
