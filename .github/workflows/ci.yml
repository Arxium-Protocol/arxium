name: Version CI and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Test the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

  monitoring:
    name: Validate monitoring bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh monitoring/native/*.sh

      - name: Check Prometheus configuration and rules
        shell: bash
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Check Compose and dashboard files
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config --quiet
          jq empty monitoring/grafana/dashboards/arxium-node.json

      - name: Smoke-test Prometheus and Grafana
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose -p arxium-monitoring-ci \
              -f monitoring/docker-compose.monitoring.yml down --volumes
          }
          trap cleanup EXIT

          docker compose -p arxium-monitoring-ci \
            -f monitoring/docker-compose.monitoring.yml up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker compose -p arxium-monitoring-ci \
                -f monitoring/docker-compose.monitoring.yml logs
              exit 1
            fi
            sleep 2
          done

          curl -fsS \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            'http://127.0.0.1:3000/api/search?query=Arxium%20Node' \
            | jq -e 'any(.[]; .title == "Arxium Node")'
          curl -fsS \
            --user "admin:${GRAFANA_ADMIN_PASSWORD}" \
            http://127.0.0.1:3000/api/datasources/uid/prometheus \
            | jq -e '.url == "http://127.0.0.1:9090"'

      - name: Smoke-test native monitoring installer
        shell: bash
        env:
          GRAFANA_PUBLIC_HOST: 127.0.0.1
          GRAFANA_ADMIN_USER: ci-admin
          GRAFANA_ADMIN_PASSWORD: CiNativeValidation1!
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          cleanup() {
            sudo ./monitoring/native/uninstall-monitoring.sh || true
          }
          trap cleanup EXIT

          sudo --preserve-env=GRAFANA_PUBLIC_HOST,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD \
            ./monitoring/native/install-monitoring.sh

          test -f /etc/arxium-monitoring/grafana-initialized
          test ! -e /etc/arxium-monitoring/grafana-bootstrap.env
          sudo systemctl is-active --quiet arxium-prometheus arxium-grafana
          curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
            -fsS https://127.0.0.1:3000/api/health >/dev/null
          curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
            --user "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
            -fsS 'https://127.0.0.1:3000/api/search?query=Arxium%20Node' \
            | jq -e 'any(.[]; .title == "Arxium Node")'

          grafana_pid="$(systemctl show -p MainPID --value arxium-grafana)"
          ! sudo sh -c "tr '\\0' '\\n' < /proc/${grafana_pid}/environ" \
            | grep -q '^GF_SECURITY_ADMIN_PASSWORD='
          sudo nft list table inet arxium_grafana >/dev/null
          sudo -u grafana curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          python3 -m http.server 30333 --bind 127.0.0.1 >/dev/null 2>&1 &
          rpc_server_pid=$!
          sleep 1
          if sudo -u grafana curl --max-time 2 -fsS http://127.0.0.1:30333/ >/dev/null; then
            echo "Grafana service account unexpectedly reached the node RPC port" >&2
            kill "$rpc_server_pid"
            exit 1
          fi
          kill "$rpc_server_pid"

          sudo ./monitoring/native/install-monitoring.sh
          if sudo ALERTMANAGER=1 ALERTMANAGER_CONFIG=/missing-alertmanager.yml \
            ./monitoring/native/install-monitoring.sh; then
            echo "Expected the invalid Alertmanager upgrade to fail" >&2
            exit 1
          fi
          sudo systemctl is-active --quiet arxium-prometheus arxium-grafana
          for attempt in $(seq 1 60); do
            if curl --cacert /etc/arxium-monitoring/grafana/grafana.crt \
              --user "${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}" \
              -fsS https://127.0.0.1:3000/api/user >/dev/null; then
              break
            fi
            [[ "$attempt" -lt 60 ]] || exit 1
            sleep 1
          done

          sudo systemctl stop arxium-grafana
          sudo mv /var/lib/arxium-monitoring/grafana/data/grafana.db /tmp/grafana.db
          if sudo ./monitoring/native/install-monitoring.sh; then
            echo "Expected the missing Grafana database check to fail closed" >&2
            exit 1
          fi
          ! sudo systemctl is-active --quiet arxium-grafana
          sudo mv /tmp/grafana.db /var/lib/arxium-monitoring/grafana/data/grafana.db
          sudo chown grafana:grafana /var/lib/arxium-monitoring/grafana/data/grafana.db
          sudo ./monitoring/native/install-monitoring.sh

  release:
    name: Build and publish release
    needs:
      - test
      - monitoring
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake build-essential libclang-dev pkg-config

      - name: Build arxd (release)
        shell: bash
        run: cargo build --release --locked -p arxd

      - name: Package binary
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          out="arxd-${tag}-x86_64-linux-gnu"
          mkdir -p "dist/${out}"
          cp target/release/arxd "dist/${out}/"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          rm -rf "dist/${out}"
          tar -czf "dist/arxium-monitoring-${tag}.tar.gz" monitoring

      # scripts/install.sh verifies the node and monitoring archives against this file.
      - name: Generate checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  arxd-${GITHUB_REF_NAME}-x86_64-linux-gnu[.]tar[.]gz$" SHA256SUMS
          grep -Eq "^[0-9a-f]{64}  arxium-monitoring-${GITHUB_REF_NAME}[.]tar[.]gz$" SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
