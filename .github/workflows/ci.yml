name: CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Test the workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show the Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version

      - name: Test the workspace
        shell: bash
        run: cargo test --workspace --locked

  monitoring:
    name: Validate monitoring bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Arxium
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/install.sh monitoring/native/*.sh

      - name: Check Prometheus configuration and rules
        shell: bash
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Check Compose and dashboard files
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config --quiet
          jq empty monitoring/grafana/dashboards/arxium-node.json
