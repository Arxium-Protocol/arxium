# Internal Nginx route for the legacy all-in-Docker chain deployment. Public
# TLS and certificate renewal are handled by nginx-proxy + acme-companion.

# The deployment's real rate limit. arxd has its own per-IP limiter
# (xc_rpc::RateLimiter), but that one is per process and in memory: run two
# RPC instances and every budget doubles, and a flood still costs the node
# a request's worth of work before being refused. Limiting here sheds it at
# the edge and applies to the fleet as a whole.
#
# Rates mirror arxd's defaults (--rpc-rate-limit-writes 60/min = 1r/s,
# --rpc-rate-limit-reads 600/min = 10r/s). Change both together, or the
# looser of the two is the one that matters.
limit_req_zone $binary_remote_addr zone=arx_write:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=arx_read:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    location = /metrics {
        return 404;
    }

    # The two state-mutating routes. `= /actions` is an exact match, so it
    # catches POST /actions (submission) and not GET /actions/{signature}
    # (status polling), which is a read and falls through to `/` below —
    # the same split the in-process limiter makes, for the same reason: a
    # client polling for its own submission must not be starved by the
    # burst it just sent.
    location = /actions {
        limit_req zone=arx_write burst=20 nodelay;
        proxy_pass http://arxd:30333;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pairing {
        limit_req zone=arx_write burst=20 nodelay;
        proxy_pass http://arxd:30333;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=arx_read burst=100 nodelay;
        proxy_pass http://arxd:30333;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
