# Internal Nginx route for the legacy all-in-Docker chain deployment. Public
# TLS and certificate renewal are handled by nginx-proxy + acme-companion.
server {
    listen 80;
    server_name _;

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://arxd:30333;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
